<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" fill="none">
  <!-- Dynamic background with glow -->
  <rect width="1440" height="810" fill="#07161B"/>
  <defs>
    <radialGradient id="recGlow1" cx="30%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#5EC2CC" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5EC2CC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="recGlow2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#E8703A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E8703A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="810" fill="url(#recGlow1)"/>
  <rect width="1440" height="810" fill="url(#recGlow2)"/>

  <!-- Top App Navigation -->
  <rect x="70" y="45" width="1300" height="60" rx="16" fill="#0F262E" fill-opacity="0.9" stroke="#F7F5F1" stroke-opacity="0.1"/>
  <circle cx="105" cy="75" r="14" fill="#5EC2CC"/>
  <text x="130" y="80" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F7F5F1">AGM Engine · Módulo de Recomendaciones con IA</text>
  <rect x="1060" y="58" width="170" height="34" rx="17" fill="#E8703A" fill-opacity="0.15" stroke="#E8703A" stroke-opacity="0.4"/>
  <circle cx="1078" cy="75" r="4" fill="#E8703A"/>
  <text x="1090" y="80" font-family="monospace" font-size="12" font-weight="700" fill="#E8703A">IA ACTIVA EN TIENDA</text>
  <rect x="1245" y="58" width="110" height="34" rx="17" fill="#5EC2CC"/>
  <text x="1262" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#07161B">Ver métricas</text>

  <!-- Left Sidebar: Customer Intelligence Profile (380px wide) -->
  <g transform="translate(70, 130)">
    <rect width="380" height="630" rx="20" fill="#0F262E" stroke="#F7F5F1" stroke-opacity="0.1" stroke-width="1.5"/>

    <text x="30" y="45" font-family="monospace" font-size="12" font-weight="700" fill="#5EC2CC">PERFIL DE CLIENTE EN VIVO</text>
    <text x="30" y="75" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#F7F5F1">Análisis de Comportamiento</text>

    <!-- Client Card -->
    <rect x="30" y="105" width="320" height="150" rx="16" fill="#07161B" stroke="#5EC2CC" stroke-opacity="0.3"/>
    <circle cx="65" cy="145" r="22" fill="#5EC2CC" fill-opacity="0.2"/>
    <text x="65" y="152" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#5EC2CC" text-anchor="middle">CM</text>
    <text x="100" y="142" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F7F5F1">Carlos Mendoza</text>
    <text x="100" y="160" font-family="monospace" font-size="11" fill="#8CA8AE">Cliente recurrente · 4 compras previas</text>

    <rect x="45" y="195" width="290" height="42" rx="10" fill="#0F262E"/>
    <text x="60" y="220" font-family="system-ui, sans-serif" font-size="12" fill="#8CA8AE">Afinidad con la categoría:</text>
    <text x="280" y="222" font-family="monospace" font-size="16" font-weight="800" fill="#22C55E">98.4%</text>

    <!-- Detected Preferences -->
    <text x="30" y="295" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F7F5F1">Preferencias detectadas por la IA:</text>
    <div transform="translate(30, 310)">
      <rect x="30" y="310" width="130" height="28" rx="14" fill="#E8703A" fill-opacity="0.15" stroke="#E8703A" stroke-opacity="0.3"/>
      <text x="45" y="328" font-family="system-ui, sans-serif" font-size="11.5" fill="#E8703A">Calzado deportivo</text>
      
      <rect x="170" y="310" width="110" height="28" rx="14" fill="#5EC2CC" fill-opacity="0.15" stroke="#5EC2CC" stroke-opacity="0.3"/>
      <text x="185" y="328" font-family="system-ui, sans-serif" font-size="11.5" fill="#5EC2CC">Talla 42 / XL</text>

      <rect x="30" y="350" width="150" height="28" rx="14" fill="#07161B" stroke="#F7F5F1" stroke-opacity="0.15"/>
      <text x="45" y="368" font-family="system-ui, sans-serif" font-size="11.5" fill="#8CA8AE">Precio medio: $40-$80</text>
    </div>

    <!-- Live Performance KPIs -->
    <g transform="translate(30, 420)">
      <rect width="320" height="85" rx="14" fill="#07161B" stroke="#22C55E" stroke-opacity="0.3"/>
      <text x="20" y="35" font-family="monospace" font-size="11" fill="#22C55E">INCREMENTO EN TICKET PROMEDIO</text>
      <text x="20" y="68" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#F7F5F1">+32.6%</text>
      <text x="160" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#8CA8AE">por sugerencias cruzadas</text>
    </g>

    <g transform="translate(30, 520)">
      <rect width="320" height="85" rx="14" fill="#07161B" stroke="#E8703A" stroke-opacity="0.3"/>
      <text x="20" y="35" font-family="monospace" font-size="11" fill="#E8703A">TASA DE CONVERSIÓN DE LA IA</text>
      <text x="20" y="68" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#F7F5F1">4.2x</text>
      <text x="100" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#8CA8AE">comparado a tienda sin IA</text>
    </g>
  </g>

  <!-- Right Main Area: Storefront Dynamic Recommendation Showcase (880px wide) -->
  <g transform="translate(490, 130)">
    <rect width="880" height="630" rx="20" fill="#0F262E" stroke="#F7F5F1" stroke-opacity="0.1" stroke-width="1.5"/>

    <!-- Banner header -->
    <g transform="translate(40, 30)">
      <rect width="800" height="90" rx="16" fill="linear-gradient(90deg, #153540 0%, #07161B 100%)" stroke="#5EC2CC" stroke-opacity="0.3"/>
      <text x="30" y="40" font-family="monospace" font-size="12" font-weight="700" fill="#5EC2CC">RECOMENDACIONES SUGERIDAS EN TIEMPO REAL</text>
      <text x="30" y="68" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#F7F5F1">«Especialmente seleccionado para tu perfil y compras recientes»</text>
      <rect x="670" y="30" width="105" height="30" rx="15" fill="#E8703A"/>
      <text x="722" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#07161B" text-anchor="middle">IA Smart-Match</text>
    </g>

    <!-- 3 Dynamic Product Cards -->
    <!-- Card 1: Principal Recommendation -->
    <g transform="translate(40, 145)">
      <rect width="250" height="340" rx="16" fill="#07161B" stroke="#E8703A" stroke-opacity="0.5" stroke-width="2"/>
      <rect x="15" y="15" width="220" height="150" rx="12" fill="#153540"/>
      <!-- Mock product image -->
      <circle cx="125" cy="90" r="45" fill="#E8703A" fill-opacity="0.25"/>
      <text x="125" y="96" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">👟</text>
      <rect x="25" y="25" width="100" height="22" rx="11" fill="#E8703A"/>
      <text x="75" y="40" font-family="monospace" font-size="10" font-weight="700" fill="#07161B" text-anchor="middle">98% COINCIDENCIA</text>

      <text x="20" y="195" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F7F5F1">Zapatillas Runner Pro</text>
      <text x="20" y="215" font-family="monospace" font-size="11" fill="#8CA8AE">Basado en tu búsqueda de hoy</text>
      <text x="20" y="245" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#E8703A">$65.00</text>
      <text x="110" y="243" font-family="monospace" font-size="12" fill="#8CA8AE">(3.237 Bs)</text>

      <rect x="20" y="275" width="210" height="42" rx="12" fill="#E8703A"/>
      <text x="125" y="301" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#07161B" text-anchor="middle">Agregar al carrito</text>
    </g>

    <!-- Card 2: Cross-Sell Bundle -->
    <g transform="translate(315, 145)">
      <rect width="250" height="340" rx="16" fill="#07161B" stroke="#5EC2CC" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="15" y="15" width="220" height="150" rx="12" fill="#153540"/>
      <circle cx="125" cy="90" r="45" fill="#5EC2CC" fill-opacity="0.25"/>
      <text x="125" y="96" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🧦</text>
      <rect x="25" y="25" width="125" height="22" rx="11" fill="#5EC2CC"/>
      <text x="87" y="40" font-family="monospace" font-size="10" font-weight="700" fill="#07161B" text-anchor="middle">FRECUENTE EN COMBO</text>

      <text x="20" y="195" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F7F5F1">Pack Medias Deportivas</text>
      <text x="20" y="215" font-family="monospace" font-size="11" fill="#8CA8AE">Sugerido para complementar</text>
      <text x="20" y="245" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#5EC2CC">$12.00</text>
      <text x="105" y="243" font-family="monospace" font-size="12" fill="#8CA8AE">(598 Bs)</text>

      <rect x="20" y="275" width="210" height="42" rx="12" fill="#0F262E" stroke="#5EC2CC" stroke-opacity="0.4"/>
      <text x="125" y="301" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#5EC2CC" text-anchor="middle">+ Añadir con 10% desc</text>
    </g>

    <!-- Card 3: Up-Sell Premium -->
    <g transform="translate(590, 145)">
      <rect width="250" height="340" rx="16" fill="#07161B" stroke="#F7F5F1" stroke-opacity="0.1" stroke-width="1.5"/>
      <rect x="15" y="15" width="220" height="150" rx="12" fill="#153540"/>
      <circle cx="125" cy="90" r="45" fill="#E8703A" fill-opacity="0.2"/>
      <text x="125" y="96" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">⌚</text>
      <rect x="25" y="25" width="110" height="22" rx="11" fill="#0F262E" stroke="#F7F5F1" stroke-opacity="0.2"/>
      <text x="80" y="40" font-family="monospace" font-size="10" font-weight="700" fill="#F7F5F1" text-anchor="middle">POPULAR EN CARACAS</text>

      <text x="20" y="195" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F7F5F1">Smartband Fitness V8</text>
      <text x="20" y="215" font-family="monospace" font-size="11" fill="#8CA8AE">Tendencia esta semana</text>
      <text x="20" y="245" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#F7F5F1">$38.00</text>
      <text x="105" y="243" font-family="monospace" font-size="12" fill="#8CA8AE">(1.892 Bs)</text>

      <rect x="20" y="275" width="210" height="42" rx="12" fill="#0F262E" stroke="#F7F5F1" stroke-opacity="0.2"/>
      <text x="125" y="301" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F7F5F1" text-anchor="middle">Ver producto</text>
    </g>

    <!-- Bottom Toast Notification in Store -->
    <g transform="translate(40, 520)">
      <rect width="800" height="75" rx="14" fill="#07161B" stroke="#22C55E" stroke-opacity="0.35"/>
      <circle cx="45" cy="38" r="14" fill="#22C55E" fill-opacity="0.2"/>
      <text x="45" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#22C55E" text-anchor="middle">⚡</text>
      <text x="75" y="33" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F7F5F1">Venta cruzada generada con éxito</text>
      <text x="75" y="53" font-family="system-ui, sans-serif" font-size="12" fill="#8CA8AE">El cliente agregó el combo recomendado al carrito antes de finalizar la compra · Ticket final: $77.00</text>
      <rect x="680" y="22" width="95" height="30" rx="15" fill="#22C55E" fill-opacity="0.15"/>
      <text x="727" y="42" font-family="monospace" font-size="11" font-weight="700" fill="#22C55E" text-anchor="middle">+45% Margen</text>
    </g>
  </g>
</svg>
