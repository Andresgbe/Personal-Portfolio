      <circle cx="210" cy="180" r="50" fill="#5EC2CC" fill-opacity="0.3"/>
      <text x="210" y="165" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#F7F5F1" text-anchor="middle">NUEVA COLECCIÓN</text>
      <text x="210" y="195" font-family="monospace" font-size="13" font-weight="700" fill="#5EC2CC" text-anchor="middle">ENVÍOS A TODO EL PAÍS</text>
      <rect x="140" y="215" width="140" height="28" rx="14" fill="#E8703A"/>
      <text x="210" y="234" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#07161B" text-anchor="middle">PIDE AL WHATSAPP</text>

      <!-- Instagram Engagement Icons -->
      <g transform="translate(20, 360)">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#E8703A" transform="scale(0.85)"/>
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="#F7F5F1" stroke-width="2" fill="none" transform="translate(32, 0) scale(0.85)"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2" stroke="#F7F5F1" stroke-width="2" fill="none" transform="translate(68, 0) scale(0.85)"/>
        <polygon points="19 21 12 16 5 21 5 3 19 3 19 21" stroke="#F7F5F1" stroke-width="2" fill="none" transform="translate(345, 0) scale(0.85)"/>
      </g>

      <!-- Likes and AI-Generated Caption -->
      <text x="20" y="402" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F7F5F1">842 Me gusta</text>
      
      <text x="20" y="426" font-family="system-ui, sans-serif" font-size="12" fill="#F7F5F1">
        <tspan font-weight="700">tu.marca.ve</tspan> Ya disponible lo nuevo de esta semana 🔥
      </text>
      <text x="20" y="446" font-family="system-ui, sans-serif" font-size="11.5" fill="#8CA8AE">Escríbenos directo al link de la bio para consultar catálogo y</text>
      <text x="20" y="464" font-family="system-ui, sans-serif" font-size="11.5" fill="#8CA8AE">precios en Bolívares y Dólares. Delivery en Caracas 🚀</text>
      
      <text x="20" y="490" font-family="system-ui, sans-serif" font-size="11" fill="#5EC2CC">#EmprendimientoVzla #Caracas #TiendaOnline #ModaVzla</text>
      <text x="20" y="515" font-family="system-ui, sans-serif" font-size="10" fill="#8CA8AE">Ver los 38 comentarios · Hace 15 minutos</text>

      <rect x="20" y="535" width="380" height="30" rx="8" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.3"/>
      <text x="210" y="555" font-family="monospace" font-size="11" font-weight="700" fill="#22C55E" text-anchor="middle">Generado y publicado sin tocar el teléfono ✓</text>
    </g>
  </g>
</svg>
