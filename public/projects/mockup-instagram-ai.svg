    <rect x="30" y="340" width="460" height="65" rx="12" fill="#07161B" stroke="#22C55E" stroke-opacity="0.3"/>
    <circle cx="58" cy="372" r="14" fill="#22C55E" fill-opacity="0.2"/>
    <text x="58" y="377" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#22C55E" text-anchor="middle">✓</text>
    <text x="88" y="365" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F7F5F1">Lunes 11:00 AM · Tip de la semana</text>
    <text x="88" y="388" font-family="monospace" font-size="11" fill="#8CA8AE">Publicado automáticamente · 4.8k vistas</text>

    <rect x="30" y="420" width="460" height="65" rx="12" fill="#07161B" stroke="#E8703A" stroke-opacity="0.4"/>
    <circle cx="58" cy="452" r="14" fill="#E8703A" fill-opacity="0.2"/>
    <text x="58" y="457" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#E8703A" text-anchor="middle">🕒</text>
    <text x="88" y="445" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F7F5F1">Hoy 7:30 PM · Lanzamiento &amp; Promo</text>
    <text x="88" y="468" font-family="monospace" font-size="11" fill="#E8703A">Listo en cola · Imagen y copy aprobados</text>

    <rect x="30" y="500" width="460" height="65" rx="12" fill="#07161B" stroke="#F7F5F1" stroke-opacity="0.1"/>
    <circle cx="58" cy="532" r="14" fill="#5EC2CC" fill-opacity="0.15"/>
    <text x="58" y="537" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#5EC2CC" text-anchor="middle">⚡</text>
    <text x="88" y="525" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F7F5F1">Sábado 10:00 AM · Testimonio cliente</text>
    <text x="88" y="548" font-family="monospace" font-size="11" fill="#8CA8AE">IA redactando carrusel automáticamente</text>

    <!-- Bottom Stat -->
