      <circle cx="35" cy="35" r="15" fill="#0F262E"/>
      <circle cx="35" cy="35" r="10" fill="#E8703A"/>
      <text x="65" y="33" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F7F5F1">tu.marca.ve</text>
      <text x="65" y="47" font-family="system-ui, sans-serif" font-size="10.5" fill="#8CA8AE">Caracas, Venezuela · Publicado por AGM Bot</text>
      <text x="390" y="38" font-family="system-ui, sans-serif" font-size="16" fill="#8CA8AE">•••</text>

      <!-- Instagram Post Image Canvas -->
      <rect x="15" y="65" width="390" height="280" rx="12" fill="#153540"/>
