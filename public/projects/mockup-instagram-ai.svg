<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" fill="none">
  <!-- Dynamic dark background with glow -->
  <rect width="1440" height="810" fill="#07161B"/>
  <defs>
    <radialGradient id="igGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#E8703A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E8703A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="igGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#5EC2CC" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5EC2CC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="igStoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8703A"/>
      <stop offset="50%" stop-color="#C13584"/>
      <stop offset="100%" stop-color="#5EC2CC"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="810" fill="url(#igGlow1)"/>
  <rect width="1440" height="810" fill="url(#igGlow2)"/>

  <!-- Top App Navigation Bar -->
  <rect x="70" y="45" width="1300" height="60" rx="16" fill="#0F262E" fill-opacity="0.9" stroke="#F7F5F1" stroke-opacity="0.1"/>
  <circle cx="105" cy="75" r="14" fill="#E8703A"/>
  <path d="M100 75 L108 70 L108 80 Z" fill="#07161B"/>
  <text x="130" y="80" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F7F5F1">AGM Studio · Autopilot Instagram con IA</text>
  <rect x="1080" y="58" width="150" height="34" rx="17" fill="#22C55E" fill-opacity="0.15" stroke="#22C55E" stroke-opacity="0.4"/>
  <circle cx="1098" cy="75" r="4" fill="#22C55E"/>
  <text x="1110" y="80" font-family="monospace" font-size="12" font-weight="700" fill="#22C55E">PILOTO ACTIVO</text>
  <rect x="1245" y="58" width="110" height="34" rx="17" fill="#E8703A"/>
  <text x="1268" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#07161B">Nuevo post</text>

  <!-- Left Side: AI Prompt & Content Studio UI (520px wide) -->
  <g transform="translate(70, 130)">
    <rect width="520" height="630" rx="20" fill="#0F262E" stroke="#F7F5F1" stroke-opacity="0.1" stroke-width="1.5"/>
    
    <text x="30" y="45" font-family="monospace" font-size="12" font-weight="700" fill="#5EC2CC">ESTUDIO DE CONTENIDO &amp; IA</text>
    <text x="30" y="75" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#F7F5F1">Generación y Copy Automático</text>
    
    <!-- AI Prompt input block -->
    <rect x="30" y="105" width="460" height="95" rx="14" fill="#07161B" stroke="#E8703A" stroke-opacity="0.4"/>
    <text x="48" y="135" font-family="monospace" font-size="11" fill="#E8703A">INSTRUCCIÓN DE LA IA:</text>
    <text x="48" y="160" font-family="system-ui, sans-serif" font-size="13.5" fill="#F7F5F1">«Crea un post promocional para viernes destacando nueva colección con tono cercano, llamada al WhatsApp y 8 hashtags clave»</text>

    <!-- Tone & Audience selector chips -->
    <text x="30" y="230" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#8CA8AE">Tono de voz &amp; Formato:</text>
    <rect x="30" y="245" width="95" height="30" rx="15" fill="#5EC2CC" fill-opacity="0.2" stroke="#5EC2CC" stroke-opacity="0.5"/>
    <text x="48" y="265" font-family="system-ui, sans-serif" font-size="12" fill="#5EC2CC">Persuasivo</text>
    
    <rect x="135" y="245" width="105" height="30" rx="15" fill="#07161B" stroke="#F7F5F1" stroke-opacity="0.15"/>
    <text x="150" y="265" font-family="system-ui, sans-serif" font-size="12" fill="#8CA8AE">Carrusel 4x5</text>

    <rect x="250" y="245" width="125" height="30" rx="15" fill="#07161B" stroke="#F7F5F1" stroke-opacity="0.15"/>
